<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💊 Pharma Brand Finder - Corrected</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9edf2;
        }
        .header h1 {
            font-size: 28px;
            color: #1a2b4c;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 span {
            background: #2a7de1;
            color: white;
            font-size: 14px;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .stats {
            font-size: 14px;
            color: #5a6e85;
            background: #f0f4f8;
            padding: 8px 18px;
            border-radius: 30px;
        }
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border: 2px solid #dce3ec;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            background: #fafcff;
        }
        .search-box input:focus {
            border-color: #2a7de1;
            box-shadow: 0 0 0 4px rgba(42,125,225,0.15);
        }
        .clear-btn {
            padding: 14px 24px;
            background: #eef2f7;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #4a5e77;
            cursor: pointer;
            transition: 0.3s;
        }
        .clear-btn:hover { background: #dce3ec; }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e9edf2;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        thead {
            background: #1a2b4c;
            color: white;
        }
        thead th {
            padding: 16px 18px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        thead th:first-child { width: 45%; }
        thead th:last-child { width: 55%; }
        tbody tr {
            border-bottom: 1px solid #eef2f7;
            transition: 0.2s;
        }
        tbody tr:hover { background: #f6f9ff; }
        tbody td {
            padding: 14px 18px;
            color: #1e2d47;
            vertical-align: middle;
        }
        .generic-clickable {
            font-weight: 600;
            color: #1a4b7a;
            cursor: pointer;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
            position: relative;
        }
        .generic-clickable:hover {
            background: #e4edfa;
            color: #2a7de1;
        }
        .generic-clickable .click-icon {
            font-size: 12px;
            color: #6a8eb0;
            margin-left: 4px;
            opacity: 0.5;
        }
        .reason-tag {
            display: inline-block;
            background: #e4edfa;
            color: #1a4b7a;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
        }
        .brand-popup {
            display: none;
            position: fixed;
            z-index: 9999;
            background: white;
            border-radius: 14px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            padding: 14px 20px;
            min-width: 120px;
            max-width: 340px;
            border: 1px solid #e9edf2;
            animation: popIn 0.2s ease;
        }
        .brand-popup.active { display: block; }
        .brand-popup .brand-item {
            padding: 2px 0;
            font-size: 15px;
            color: #1a2b4c;
            font-weight: 500;
            line-height: 1.6;
        }
        .brand-popup .brand-item .brand-highlight {
            color: #1a4b7a;
            font-weight: 700;
            font-size: 16px;
        }
        .brand-popup .brand-item .brand-other {
            color: #4a5e77;
            font-weight: 400;
        }
        .brand-popup .brand-item .separator {
            color: #8a9bb0;
            margin: 0 2px;
            font-weight: 300;
        }
        .brand-popup .no-brands {
            color: #8a9bb0;
            font-size: 14px;
            padding: 4px 0;
        }
        .brand-popup .popup-arrow {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-left: 1px solid #e9edf2;
            border-top: 1px solid #e9edf2;
            transform: rotate(45deg);
        }
        .brand-popup.arrow-bottom .popup-arrow {
            top: -7px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }
        .brand-popup.arrow-top .popup-arrow {
            bottom: -7px;
            left: 20px;
            border-right: none;
            border-bottom: none;
            transform: rotate(225deg);
        }
        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #6a7e97;
        }
        .no-results .icon { font-size: 48px; margin-bottom: 10px; }
        @media (max-width: 700px) {
            .container { padding: 16px; }
            .header h1 { font-size: 20px; }
            .header h1 span { font-size: 12px; padding: 2px 10px; }
            .search-box input, .clear-btn { font-size: 14px; padding: 12px 16px; }
            thead th, tbody td { padding: 12px 14px; font-size: 14px; }
            .stats { font-size: 12px; padding: 5px 14px; }
            .brand-popup { min-width: 100px; max-width: 260px; padding: 12px 16px; }
            .brand-popup .brand-item { font-size: 14px; }
        }
        @media (max-width: 500px) {
            .container { padding: 12px; border-radius: 16px; }
            .header { flex-direction: column; align-items: flex-start; }
            .search-box { flex-direction: column; }
            .search-box input, .clear-btn { width: 100%; }
            table { font-size: 13px; }
            thead th, tbody td { padding: 10px 12px; }
            .brand-popup { min-width: 90px; max-width: 220px; padding: 10px 14px; }
            .brand-popup .brand-item { font-size: 13px; }
        }
        @media print {
            .search-box { display: none; }
            .stats { display: none; }
            .generic-clickable .click-icon { display: none; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border-radius: 0; padding: 10px; }
            .brand-popup { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">

            <div class="stats" id="stats">Showing <strong id="countDisplay">0</strong> generics</div>

        <div class="search-box">

        // ===========================================
        // 🚀 APP LOGIC
        // ===========================================

        const searchInput = document.getElementById('searchInput');
        const tableBody = document.getElementById('tableBody');
        const noResults = document.getElementById('noResults');
        const countDisplay = document.getElementById('countDisplay');
        const clearBtn = document.getElementById('clearBtn');

        const popup = document.getElementById('brandPopup');
        const popupBrandList = document.getElementById('popupBrandList');
        const popupArrow = document.getElementById('popupArrow');

        let activePopupGeneric = null;

        function render(filtered) {
            if (filtered.length === 0) {
                tableBody.innerHTML = '';
                noResults.style.display = 'block';
                countDisplay.textContent = '0';
                return;
            }

            noResults.style.display = 'none';
            countDisplay.textContent = filtered.length;

            tableBody.innerHTML = filtered.map((item) =>
                `<tr>
                    <td>
                        <span class="generic-clickable" data-generic="${item.generic}">
                            ${item.generic}
                            <span class="click-icon">👆</span>
                        </span>
                    </td>
                    <td><span class="reason-tag">${item.reason}</span></td>
                </tr>`
            ).join('');

            document.querySelectorAll('.generic-clickable').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const genericName = this.dataset.generic;
                    const rect = this.getBoundingClientRect();
                    showPopup(genericName, rect);
                });
            });
        }

        function filterMedicines() {
            const query = searchInput.value.trim().toLowerCase();
            const filtered = medicineData.filter(item => {
                const matchGeneric = item.generic.toLowerCase().includes(query);
                const matchReason = item.reason.toLowerCase().includes(query);
                const matchBrands = item.brands.some(b => b.toLowerCase().includes(query));
                return matchGeneric || matchReason || matchBrands;
            });
            render(filtered);
            hidePopup();
        }

        function showPopup(genericName, rect) {
            const item = medicineData.find(m => m.generic === genericName);
            if (!item) return;
            hidePopup();

            if (item.brands.length === 0) {
                popupBrandList.innerHTML = `<div class="no-brands">No brands</div>`;
            } else {
                const firstBrand = item.brands[0];
                const otherBrands = item.brands.slice(1);
                let html = `<div class="brand-item"><span class="brand-highlight">${firstBrand}</span>`;
                if (otherBrands.length > 0) {
                    html += `<span class="separator">,</span> <span class="brand-other">${otherBrands.join(', ')}</span>`;
                }
                html += `</div>`;
                popupBrandList.innerHTML = html;
            }

            const popupWidth = Math.min(300, window.innerWidth - 40);
            let left = rect.left + (rect.width / 2) - (popupWidth / 2);
            let top = rect.bottom + 12;
            let arrowPos = 'bottom';

            if (left + popupWidth > window.innerWidth - 20) left = window.innerWidth - popupWidth - 20;
            if (left < 20) left = 20;

            const popupHeight = 70;
            if (top + popupHeight > window.innerHeight - 20) {
                top = rect.top - 20 - popupHeight;
                arrowPos = 'top';
            }

            popup.style.width = popupWidth + 'px';
            popup.style.left = left + 'px';
            popup.style.top = top + 'px';
            popup.className = 'brand-popup active';
            popup.classList.add(arrowPos === 'top' ? 'arrow-top' : 'arrow-bottom');

            const arrowLeft = Math.min(Math.max(20, (rect.left + rect.width / 2) - left - 6), popupWidth - 40);
            popupArrow.style.left = arrowLeft + 'px';
            activePopupGeneric = genericName;
        }

        function hidePopup() {
            popup.classList.remove('active', 'arrow-bottom', 'arrow-top');
            activePopupGeneric = null;
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.generic-clickable') && !e.target.closest('.brand-popup')) hidePopup();
        });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hidePopup(); });
        window.addEventListener('scroll', hidePopup);
        window.addEventListener('resize', hidePopup);

        searchInput.addEventListener('input', filterMedicines);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterMedicines();
            searchInput.focus();
        });

        filterMedicines();
    </script>

</body>
</html>
